<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</label>
</div>
</section>
</div>
<!-- Persistent Docked Bottom Floating Send Shelf -->
<div class="fixed bottom-0 left-0 right-0 z-40 px-margin-mobile pb-space-md pt-space-xs bg-gradient-to-t from-surface via-surface/95 to-transparent pointer-events-none">
<div class="max-w-md mx-auto w-full bg-surface-container-lowest/95 backdrop-blur-xl p-space-sm rounded-DEFAULT shadow-xl flex flex-col gap-space-xs pointer-events-auto">
<!-- Selected Pills Carousel & Clear Header -->
<div class="flex items-center justify-between px-space-xs">
<div class="flex items-center gap-space-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Sending to</span>
<span class="bg-secondary text-on-secondary px-2 py-0.5 rounded-full font-label-sm text-label-sm font-bold" id="badge-count">
            3 selected
          </span>
</div>
<button class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" onclick="clearAllSelections()" type="button">
          Clear all
        </button>
</div>
<!-- Recipient Token Pills -->
<div class="flex items-center gap-1.5 overflow-x-auto py-1 no-scrollbar" id="pills-container">
<div class="shrink-0 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1" id="pill-maya">
<span>Maya</span>
<span class="material-symbols-outlined text-[14px] cursor-pointer" onclick="removeRecipient('maya')">close</span>
</div>
<div class="shrink-0 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1" id="pill-devon">
<span>Devon</span>
<span class="material-symbols-outlined text-[14px] cursor-pointer" onclick="removeRecipient('devon')">close</span>
</div>
<div class="shrink-0 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1" id="pill-chloe">
<span>Chloe</span>
<span class="material-symbols-outlined text-[14px] cursor-pointer" onclick="removeRecipient('chloe')">close</span>
</div>
</div>
<!-- Big Primary Forest Send Button -->
<button class="w-full h-12 bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md transition-all duration-150 mt-1" id="send-button" type="button">
<span class="material-symbols-outlined text-[20px]">send</span>
<span id="send-btn-label">Send (3)</span>
</button>
</div>
</div>
</div>
<script>
  const selectedState = new Map([
    ['maya', 'Maya Lin'],
    ['devon', 'Devon Vance'],
    ['chloe', 'Chloe Chen']
  ]);

  function setViewMode(mode) {
    const onceBtn = document.getElementById('toggle-view-once');
    const storyBtn = document.getElementById('toggle-story');
    if (mode === 'once') {
      onceBtn.className = "flex-1 py-2 px-space-md rounded-full font-label-md text-label-md flex items-center justify-center gap-space-xs transition-all duration-200 bg-primary-container text-on-primary shadow-sm";
      onceBtn.setAttribute('aria-pressed', 'true');
      storyBtn.className = "flex-1 py-2 px-space-md rounded-full font-label-md text-label-md flex items-center justify-center gap-space-xs transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      storyBtn.setAttribute('aria-pressed', 'false');
    } else {
      storyBtn.className = "flex-1 py-2 px-space-md rounded-full font-label-md text-label-md flex items-center justify-center gap-space-xs transition-all duration-200 bg-primary-container text-on-primary shadow-sm";
      storyBtn.setAttribute('aria-pressed', 'true');
      onceBtn.className = "flex-1 py-2 px-space-md rounded-full font-label-md text-label-md flex items-center justify-center gap-space-xs transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      onceBtn.setAttribute('aria-pressed', 'false');
    }
  }

  function updateShelfUI() {
    const count = selectedState.size;
    const badge = document.getElementById('badge-count');
    const sendLabel = document.getElementById('send-btn-label');
    const sendBtn = document.getElementById('send-button');
    const container = document.getElementById('pills-container');

    badge.textContent = `${count} selected`;
    sendLabel.textContent = count > 0 ? `Send (${count})` : 'Send';

    if (count === 0) {
      sendBtn.classList.add('opacity-50', 'pointer-events-none');
    } else {
      sendBtn.classList.remove('opacity-50', 'pointer-events-none');
    }

    container.innerHTML = '';
    selectedState.forEach((name, id) => {
      const firstName = name.split(' ')[0];
      const pill = document.createElement('div');
      pill.id = `pill-${id}`;
      pill.className = "shrink-0 bg-primary-fixed text-on-primary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1 animate-fade-in";
      pill.innerHTML = `<span>${firstName}</span><span class="material-symbols-outlined text-[14px] cursor-pointer" onclick="removeRecipient('${id}')">close</span>`;
      container.appendChild(pill);
    });
  }

  function toggleRecipient(id, name, isChecked) {
    if (isChecked) {
      selectedState.set(id, name);
    } else {
      selectedState.delete(id);
    }
    updateShelfUI();
  }

  function removeRecipient(id) {
    selectedState.delete(id);
    const checkboxes = document.querySelectorAll('.recipient-checkbox');
    checkboxes.forEach(cb => {
      if (cb.getAttribute('onchange')?.includes(`'${id}'`)) {
        cb.checked = false;
      }
    });
    updateShelfUI();
  }

  function clearAllSelections() {
    selectedState.clear();
    const checkboxes = document.querySelectorAll('.recipient-checkbox');
    checkboxes.forEach(cb => {
      cb.checked = false;
    });
    updateShelfUI();
  }
</script></main></body></html>
